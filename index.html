<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfaf7" />
    <meta name="description" content="Discover thoughtfully selected homes with Aura Estates." />
    <title>Aura Estates — Find a place that feels like home</title>
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="icon" type="image/png" href="/favicon.png" />
  </head>
  <body>
    <script>
      // Set the saved theme before React paints to prevent a light-mode flash.
      (function () {
        try {
          var saved = localStorage.getItem("haven-theme");
          var theme = saved === "dark" ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (_) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <div id="root"></div>
    <script src="https://js.puter.com/v2/"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
